<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA Scholars — Проверка сертификата</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17233b;font:16px system-ui,sans-serif}main{max-width:760px;margin:60px auto;padding:24px}header{margin-bottom:28px}.brand{font-size:28px;font-weight:800;color:#12396b}h1{font-size:26px}article{background:white;border-radius:18px;padding:28px;box-shadow:0 10px 35px #10204010}form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:13px;border:1px solid #aab8cb;border-radius:8px;font:inherit}button{padding:13px 20px;background:#12396b;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#message{margin-top:22px;white-space:pre-line}.good{color:#166534}.bad{color:#b91c1c}.neutral{color:#6b5300}dl{display:grid;grid-template-columns:150px 1fr;gap:14px}dt{color:#64748b}dd{margin:0;overflow-wrap:anywhere}footer{font-size:13px;color:#64748b;margin-top:24px;line-height:1.6}[hidden]{display:none!important}@media(max-width:550px){main{margin:20px auto;padding:14px}article{padding:20px}dl{grid-template-columns:1fr;gap:7px}dd{margin-bottom:12px}}
</style></head><body><main><header><div class="brand">CA Scholars</div><h1>Проверка сертификата</h1><p>Введите номер или откройте ссылку из QR-кода.</p></header><article>
<form id="form"><input id="number" aria-label="Номер сертификата" placeholder="CAS-2026-001" maxlength="120" required><button id="button" type="submit">Проверить</button></form>
<p id="message" role="status" aria-live="polite"></p><section id="result" hidden><dl id="details"></dl><button id="copy" type="button">Копировать ссылку</button></section>
</article><footer>Сведения предоставлены реестром CA Scholars. Сравните имя, номер и курс с документом. Проверка записи не является электронной подписью.<br><a href="https://github.com/kanatsamarkhanov" rel="noopener">GitHub автора</a></footer></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('number'),message=document.getElementById('message'),result=document.getElementById('result'),details=document.getElementById('details'),button=document.getElementById('button');
function notice(text,style=''){message.textContent=text;message.className=style;}
function row(label,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=String(value??'—');details.append(dt,dd);}
async function verify(){const id=input.value.trim().toUpperCase();if(!id)return;input.value=id;result.hidden=true;details.replaceChildren();button.disabled=true;notice('Загрузка реестра…');const url=new URL(location.href);url.searchParams.set('id',id);history.replaceState(null,'',url);
try{const response=await fetch('./certificates.json',{cache:'no-store'});if(!response.ok)throw new Error('Registry unavailable');const db=await response.json();if(!db||typeof db!=='object'||Array.isArray(db))throw new Error('Invalid registry');if(!Object.prototype.hasOwnProperty.call(db,id)){notice('Сертификат не найден в опубликованном реестре. Проверьте номер или обратитесь к выдавшей организации.','bad');return;}const item=db[id];if(!item||typeof item!=='object')throw new Error('Invalid record');
const statuses={valid:['Сертификат действителен','good'],revoked:['Сертификат аннулирован','bad'],demo:['Демонстрационная запись — не настоящий сертификат','neutral']};const status=statuses[item.status]||['Статус не подтверждён. Обратитесь к выдавшей организации.','neutral'];notice(...status);row('Номер',id);row('Получатель',item.display_name);row('Курс',item.course);row('Объём',item.hours==null?'—':String(item.hours)+' ч.');row('Дата выдачи',item.issued_on);row('Организация',item.issuer);if(item.status==='revoked'&&item.revocation_note)row('Примечание',item.revocation_note);result.hidden=false;
}catch(error){notice('Не удалось загрузить реестр. Повторите позже. Это техническая ошибка, а не подтверждение недействительности сертификата.','bad');}finally{button.disabled=false;}}
form.addEventListener('submit',event=>{event.preventDefault();verify();});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copy').textContent='Ссылка скопирована';}catch{notice('Скопируйте адрес страницы из адресной строки.');}});const initial=new URLSearchParams(location.search).get('id');if(initial){input.value=initial;verify();}
</script></body></html>
